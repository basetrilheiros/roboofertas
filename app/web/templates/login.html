<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — Base Trilheiros</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><main><section class="card"><h1>Base Trilheiros</h1><p>Acesse seu painel de vendas e ofertas.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ session.ml_setup_csrf }}"><div class="form-group"><label for="username">Usuário</label><input id="username" name="username" required autocomplete="username" maxlength="100"></div><div class="form-group"><label for="password">Senha</label><input id="password" name="password" type="password" required autocomplete="current-password" maxlength="1024"></div><button class="btn btn-primary">Entrar</button></form></section></main></body></html>
