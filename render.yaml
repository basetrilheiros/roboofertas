services:
  - type: web
    name: basetrilheiros-painel
    runtime: python
    plan: free
    branch: codex/hospedagem-online
    buildCommand: pip install -r app/requirements-cloud.txt
    startCommand: gunicorn --chdir app --config gunicorn.conf.py wsgi:app
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: BASETRILHEIROS_CLOUD
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: BASETRILHEIROS_SECRET_KEY
        generateValue: true
      - key: BASETRILHEIROS_MASTER_SECRET
        generateValue: true
